<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generate Meal Plan - MealMatic</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #000000;
            --secondary-color: #333333;
            --text-color: #333333;
            --light-bg: #f5f5f5;
            --white: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--light-bg);
            color: var(--text-color);
            max-width: 100%;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .app-container {
            max-width: 414px;
            margin: 0 auto;
            background-color: var(--white);
            min-height: 100vh;
            position: relative;
            box-shadow: var(--shadow);
        }
        
        /* Header/Navbar */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--white);
            color: var(--primary-color);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            border-bottom: 1px solid #e0e0e0;
        }
        
        .app-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .app-header button {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 1.2rem;
        }
        
        /* Form Styles */
        .form-container {
            padding: 20px;
            padding-bottom: 80px;
        }
        
        .form-section {
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--primary-color);
            position: relative;
            padding-bottom: 5px;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50px;
            height: 3px;
            background-color: var(--primary-color);
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            background-color: var(--white);
            transition: all 0.3s ease;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1);
        }
        
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
        }
        
        .radio-option input {
            width: auto;
            margin-right: 5px;
        }
        
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        
        .checkbox-option {
            display: flex;
            align-items: center;
        }
        
        .checkbox-option input {
            width: auto;
            margin-right: 8px;
        }
        
        .submit-btn {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            box-shadow: var(--shadow);
        }
        
        .submit-btn:hover {
            background-color: var(--secondary-color);
        }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--white);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            max-width: 414px;
            margin: 0 auto;
            border-top: 1px solid #e0e0e0;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #666;
            text-decoration: none;
            font-size: 0.7rem;
        }
        
        .nav-item i {
            font-size: 1.2rem;
            margin-bottom: 3px;
        }
        
        .nav-item.active {
            color: var(--primary-color);
        }
        
        /* Loading Indicator */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid var(--primary-color);
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Results Section */
        .results-container {
            display: none;
            padding: 20px;
            padding-bottom: 80px;
        }
        
        .meal-plan-section {
            margin-bottom: 25px;
        }
        
        .meal-card {
            background-color: var(--white);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            border: 1px solid #e0e0e0;
        }
        
        .meal-card h3 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        
        .meal-card p {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
        }
        
        .nutrition-facts {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ddd;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- App Header -->
        <header class="app-header">
            <h1>Generate Meal Plan</h1>
            <button onclick="window.location.href='{{ url_for('home') }}'"><i class="fas fa-chevron-left"></i></button>
        </header>
        
        <!-- Form Container -->
        <div class="form-container" id="formContainer">
            <form id="mealPlanForm">
                <!-- Basic Information -->
                <div class="form-section">
                    <h2 class="section-title">Basic Information</h2>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age" required>
                    </div>
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="height">Height (cm)</label>
                        <input type="number" id="height" name="height" required>
                    </div>
                    <div class="form-group">
                        <label for="weight">Weight (kg)</label>
                        <input type="number" id="weight" name="weight" required>
                    </div>
                </div>
                
                <!-- Activity Level -->
                <div class="form-section">
                    <h2 class="section-title">Activity Level</h2>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="activity_level" value="1" required> Sedentary
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="activity_level" value="2"> Lightly active
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="activity_level" value="3"> Moderately active
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="activity_level" value="4"> Very active
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="activity_level" value="5"> Super active
                        </label>
                    </div>
                </div>
                
                <!-- Dietary Preferences -->
                <div class="form-section">
                    <h2 class="section-title">Dietary Preferences</h2>
                    <div class="checkbox-group">
                        <label class="checkbox-option">
                            <input type="checkbox" name="dietary_prefs" value="1"> Vegetarian
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="dietary_prefs" value="2"> Non-Vegetarian
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="dietary_prefs" value="3"> Vegan
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="dietary_prefs" value="4"> No specific diet
                        </label>
                    </div>
                </div>
                
                <!-- Fitness Goals -->
                <div class="form-section">
                    <h2 class="section-title">Fitness Goals</h2>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="fitness_goal" value="1" required> Weight loss
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="fitness_goal" value="2"> Muscle gain
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="fitness_goal" value="3"> Maintenance
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="fitness_goal" value="4"> Improve health
                        </label>
                    </div>
                </div>
                
                <!-- Health Issues -->
                <div class="form-section">
                    <h2 class="section-title">Health Issues</h2>
                    <div class="checkbox-group">
                        <label class="checkbox-option">
                            <input type="checkbox" name="health_issues" value="1"> Diabetes
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="health_issues" value="2"> Hypertension
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="health_issues" value="3"> Heart disease
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="health_issues" value="4"> High cholesterol
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="health_issues" value="5"> None
                        </label>
                    </div>
                </div>
                
                <!-- Additional Information -->
                <div class="form-section">
                    <h2 class="section-title">Additional Information</h2>
                    <div class="form-group">
                        <label for="allergies">Food Allergies (comma separated)</label>
                        <input type="text" id="allergies" name="allergies" placeholder="e.g., peanuts, shellfish">
                    </div>
                    <div class="form-group">
                        <label for="cuisine_preference">Preferred Cuisines (comma separated)</label>
                        <input type="text" id="cuisine_preference" name="cuisine_preference" placeholder="e.g., Italian, Indian, Mexican">
                    </div>
                </div>
                
                <button type="submit" class="submit-btn">Generate Meal Plan</button>
            </form>
        </div>
        
        <!-- Loading Indicator -->
        <div class="loading" id="loadingIndicator">
            <div class="spinner"></div>
            <p>Creating your personalized meal plan...</p>
        </div>
        
        <!-- Results Container -->
        <div class="results-container" id="resultsContainer">
            <h2 class="section-title">Your Personalized Meal Plan</h2>
            <div id="mealPlanResults">
                <!-- Results will be inserted here by JavaScript -->
            </div>
            <button class="submit-btn" onclick="window.location.href='{{ url_for('generate') }}'">Create Another Plan</button>
        </div>
        
        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="{{ url_for('home') }}"  class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="{{ url_for('workout') }}"  class="nav-item">
                <i class="fas fa-dumbbell"></i>
                <span>Workout</span>
            </a>
            <a href="{{ url_for('generate') }}"  class="nav-item active">
                <i class="fas fa-utensils"></i>
                <span>Meals</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-user"></i>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <script>
        document.getElementById('mealPlanForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    // Show loading
    document.getElementById('formContainer').style.display = 'none';
    document.getElementById('loadingIndicator').style.display = 'block';
    document.getElementById('resultsContainer').style.display = 'none';
    
    try {
        const formData = new FormData(this);
        
        // Add checkbox values
        const dietaryPrefs = Array.from(document.querySelectorAll('input[name="dietary_prefs"]:checked')).map(el => el.value);
        const healthIssues = Array.from(document.querySelectorAll('input[name="health_issues"]:checked')).map(el => el.value);
        
        // Create complete data object
        const data = {
            name: formData.get('name'),
            age: formData.get('age'),
            gender: formData.get('gender'),
            height: formData.get('height'),
            weight: formData.get('weight'),
            activity_level: formData.get('activity_level'),
            dietary_prefs: dietaryPrefs,
            fitness_goal: formData.get('fitness_goal'),
            health_issues: healthIssues,
            allergies: formData.get('allergies'),
            cuisine_preference: formData.get('cuisine_preference')
        };
        
        const response = await fetch('/generate', {
            method: 'POST',
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams(data).toString()
        });
        
        const result = await response.json();
        
        if (result.status === 'success') {
            displayMistralResponse(result);
        } else {
            throw new Error(result.message || 'Failed to generate meal plan');
        }
    } catch (error) {
        console.error('Error:', error);
        alert('Error generating meal plan: ' + error.message);
    } finally {
        document.getElementById('loadingIndicator').style.display = 'none';
    }
});

function displayMistralResponse(response) {
    const { user_profile, meal_plan } = response;
    const resultsContainer = document.getElementById('resultsContainer');
    const mealPlanResults = document.getElementById('mealPlanResults');
    
    // Clear previous results
    mealPlanResults.innerHTML = '';
    
    // Display user profile
    const profileSection = document.createElement('div');
    profileSection.className = 'meal-plan-section';
    profileSection.innerHTML = `
        <div class="meal-card">
            <h3>Your Profile</h3>
            <p><strong>Name:</strong> ${user_profile.name}</p>
            <p><strong>Goal:</strong> ${getGoalText(user_profile.fitness_goal)}</p>
            <p><strong>Diet:</strong> ${getDietText(user_profile.dietary_prefs)}</p>
            ${user_profile.allergies ? `<p><strong>Allergies:</strong> ${user_profile.allergies}</p>` : ''}
        </div>
    `;
    mealPlanResults.appendChild(profileSection);
    
    // Display the generated meal plan
    const planSection = document.createElement('div');
    planSection.className = 'meal-plan-section';
    planSection.innerHTML = `
        <div class="meal-card">
            <h3>Your Personalized Meal Plan</h3>
            <div style="white-space: pre-wrap; line-height: 1.6;">${meal_plan.text}</div>
        </div>
    `;
    mealPlanResults.appendChild(planSection);
    
    // Show results container
    resultsContainer.style.display = 'block';
}

// Helper functions
function getGoalText(goal) {
    const goals = {
        "1": "Weight Loss",
        "2": "Muscle Gain",
        "3": "Maintenance",
        "4": "Improve Health"
    };
    return goals[goal] || goal;
}

function getDietText(diets) {
    const dietMap = {
        "1": "Vegetarian",
        "2": "Non-Vegetarian",
        "3": "Vegan",
        "4": "No Restrictions"
    };
    return diets.map(d => dietMap[d] || d).join(", ");
}
    </script>
</body>
</html>
